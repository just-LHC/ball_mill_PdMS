services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ball_mill_pdm
      POSTGRES_USER: pdm_app
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD using .env or .env.example}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  local_postgres_data: